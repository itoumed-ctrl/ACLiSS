<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#203863" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ACLiSS" />
    <title>ACLiSS</title>
    <link rel="icon" href="icons/favicon-32.png?v=__BUILD_ID__" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/icon-192.png?v=__BUILD_ID__" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=__BUILD_ID__" />
    <link rel="manifest" href="manifest.webmanifest?v=__BUILD_ID__" />
    <link rel="stylesheet" href="app.css?v=__BUILD_ID__" />
    <script>
      // オープニングは起動した時に1回だけ（同じタブで開き直した時は出さない）
      try {
        if (sessionStorage.getItem("acliss-opening")) document.documentElement.classList.add("no-opening");
        else sessionStorage.setItem("acliss-opening", "1");
      } catch (e) {}
    </script>
    <!-- defer: ページを読みながら並行して取り寄せ、読み終えてから動かす -->
    <script src="app.js?v=__BUILD_ID__" defer></script>
  </head>
  <body>
    <div class="opening" aria-hidden="true">
      <img src="icons/icon-512.png?v=__BUILD_ID__" alt="" width="168" height="168" />
      <p>臨床検査情報提供システム</p>
    </div>
    <header class="appbar">
      <a href="#/" class="brand">ACLiSS</a>
      <span class="brand-sub">臨床検査情報提供システム</span>
    </header>
    <main id="main"></main>
    <noscript>ACLiSSを使うには、ブラウザのJavaScriptを有効にしてください。</noscript>
  </body>
</html>
